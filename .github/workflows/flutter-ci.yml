name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version calculation
        run: scripts/release/test-next-version.sh
      - name: Validate platform preparation script
        run: scripts/ci/test-prepare-flutter-platforms.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android and iOS project shells
        run: scripts/ci/prepare-flutter-platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Android debug build
        run: flutter build apk --debug

  ios-build:
    name: iOS unsigned build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android and iOS project shells
        run: scripts/ci/prepare-flutter-platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: iOS no-codesign build
        run: flutter build ios --no-codesign
