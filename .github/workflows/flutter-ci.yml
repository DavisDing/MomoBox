name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version calculation
        run: scripts/release/test-next-version.sh
      - name: Validate platform preparation script
        run: scripts/ci/test-prepare-flutter-platforms.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android 17 SDK platform
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0"
      - name: Generate Android and iOS project shells
        run: scripts/ci/prepare-flutter-platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Android debug build
        run: flutter build apk --debug

  ios-build:
    name: iOS unsigned build (Xcode 27)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select Xcode 27
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.0.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Verify iOS 27 SDK is available
        run: |
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          python3 - "$sdk_version" <<'PY'
          import sys

          actual = tuple(int(part) for part in sys.argv[1].split('.') if part.isdigit())
          required = (27, 0)
          if actual < required:
              raise SystemExit(
                  f'iOS 27 SDK is required for this build; runner only provides {sys.argv[1]}.'
              )
          print(f'Using iOS SDK {sys.argv[1]}.')
          PY
      - name: Generate Android and iOS project shells
        run: scripts/ci/prepare-flutter-platforms.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: iOS no-codesign build
        run: flutter build ios --no-codesign
