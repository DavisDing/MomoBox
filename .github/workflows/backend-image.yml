name: Publish backend container

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish-latest:
    # The explicit repository check prevents a fork from attempting to publish
    # an image into the canonical GHCR namespace.
    if: >-
      github.repository == 'DavisDing/MomoBox' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.8'
          cache-dependency-path: backend/go.sum

      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Set up QEMU for ARM64 image builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davisding/momobox-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MomoBox NAS backend
            org.opencontainers.image.description=MomoBox Go backend for NAS deployment
            org.opencontainers.image.source=https://github.com/DavisDing/MomoBox
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
