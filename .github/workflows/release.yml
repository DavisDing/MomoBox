name: Release MomoBox packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only publish from the repository's configured default branch. This also
    # lets workflow_dispatch safely run from that branch without hard-coding
    # a branch name such as main.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release version calculation
        run: scripts/release/test-next-version.sh
      - name: Validate platform preparation script
        run: scripts/ci/test-prepare-flutter-platforms.sh

      - name: Calculate the release version
        id: version
        run: scripts/release/next-version.sh

      - name: Explain why no release was created
        if: steps.version.outputs.release_required != 'true'
        run: |
          echo 'No feat/fix/perf/revert or breaking Conventional Commit was found.'
          echo 'No package or GitHub Release is needed for this push.'

      - name: Set up Flutter
        if: steps.version.outputs.release_required == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android 17 SDK platform
        if: steps.version.outputs.release_required == 'true'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0"

      - name: Generate the Android project shell
        if: steps.version.outputs.release_required == 'true'
        run: scripts/ci/prepare-flutter-platforms.sh

      - name: Install Dart packages
        if: steps.version.outputs.release_required == 'true'
        run: flutter pub get

      - name: Generate Drift files
        if: steps.version.outputs.release_required == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify release candidate
        if: steps.version.outputs.release_required == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter analyze
          flutter test --reporter expanded \
            --dart-define="MOMO_APP_VERSION=$VERSION" --dart-define="MOMO_BUILD_NUMBER=$BUILD_NUMBER"

      - name: Build versioned Android packages
        if: steps.version.outputs.release_required == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define="MOMO_APP_VERSION=$VERSION" --dart-define="MOMO_BUILD_NUMBER=$BUILD_NUMBER"
          flutter build appbundle --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define="MOMO_APP_VERSION=$VERSION" --dart-define="MOMO_BUILD_NUMBER=$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MomoBox-v${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/MomoBox-v${VERSION}.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Set up Go for backend image release
        if: steps.version.outputs.release_required == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.8'
          cache-dependency-path: backend/go.sum

      - name: Test and vet backend release candidate
        if: steps.version.outputs.release_required == 'true'
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Set up QEMU for ARM64 image builds
        if: steps.version.outputs.release_required == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.release_required == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.release_required == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate backend release image metadata
        if: steps.version.outputs.release_required == 'true'
        id: backend-image-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/davisding/momobox-backend
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MomoBox NAS backend
            org.opencontainers.image.description=MomoBox Go backend for NAS deployment
            org.opencontainers.image.source=https://github.com/DavisDing/MomoBox
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish versioned backend image
        if: steps.version.outputs.release_required == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.backend-image-meta.outputs.tags }}
          labels: ${{ steps.backend-image-meta.outputs.labels }}

      - name: Create or update GitHub Release and upload packages
        if: steps.version.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          assets=(
            "dist/MomoBox-v${VERSION}.apk"
            "dist/MomoBox-v${VERSION}.aab"
            'dist/SHA256SUMS.txt'
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its package assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --target "$TARGET" \
              --title "MomoBox v${VERSION}" \
              --generate-notes \
              "${assets[@]}"
          fi
