<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e9e2" stop-opacity=".7"/>
      <stop offset=".27" stop-color="#fbf7f3"/>
      <stop offset="1" stop-color="#fbf7f3"/>
    </linearGradient>
    <linearGradient id="intake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e58b76"/><stop offset="1" stop-color="#cc6c58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#6b483e" flood-opacity=".12"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#cd6750" flood-opacity=".25"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #352d2b; }
      .muted { fill: #8d817d; }
      .small { font-size: 10px; }
    </style>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="35" cy="0" r="115" fill="#d97963" opacity=".10"/>

  <!-- Header -->
  <rect x="16" y="44" width="42" height="42" rx="14" fill="#fae5de"/>
  <text x="37" y="72" text-anchor="middle" class="font" font-size="21" font-weight="700" fill="#d97963">箱</text>
  <text x="68" y="64" class="font" font-size="18" font-weight="700">嬷嬷的温馨小家</text>
  <text x="68" y="81" class="font muted" font-size="12">美好生活 · 秩序井然</text>
  <text x="356" y="73" class="font muted" font-size="24">⋯</text>

  <!-- Main card: compact centered 1/3 + 2/3 layout -->
  <rect x="66" y="116" width="258" height="206" rx="20" fill="#fffdfb" stroke="#eee4df" filter="url(#shadow)"/>
  <text x="80" y="143" class="font" font-size="14" font-weight="700">快速入库</text>
  <text x="310" y="143" text-anchor="end" class="font muted" font-size="10">统一入口</text>

  <!-- Intake left: one third -->
  <rect x="80" y="158" width="75" height="132" rx="16" fill="url(#intake)" filter="url(#smallShadow)"/>
  <rect x="99" y="174" width="37" height="37" rx="12" fill="#fff" opacity=".18"/>
  <text x="117.5" y="199" text-anchor="middle" font-size="22" fill="#fff">▣</text>
  <text x="117.5" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#fff">入库</text>

  <!-- Services right: two thirds in one container -->
  <rect x="163" y="158" width="147" height="132" rx="16" fill="#fffefa" stroke="#eee4df"/>
  <line x1="174" y1="202" x2="299" y2="202" stroke="#eee4df"/>
  <line x1="174" y1="246" x2="299" y2="246" stroke="#eee4df"/>

  <!-- NAS -->
  <rect x="172" y="168" width="24" height="24" rx="8" fill="#f5f0ed"/>
  <text x="184" y="185" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#847873">▤</text>
  <text x="201" y="179" class="font" font-size="10.5" font-weight="700">NAS</text>
  <text x="201" y="191" class="font muted" font-size="7.5">存储</text>
  <circle cx="271" cy="180" r="2.8" fill="#a9a09b"/>
  <text x="278" y="183.5" class="font" font-size="8.5" fill="#756b67">未接入</text>

  <!-- Home Assistant -->
  <rect x="172" y="212" width="24" height="24" rx="8" fill="#f5f0ed"/>
  <text x="184" y="229" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#847873">⌂</text>
  <text x="201" y="223" class="font" font-size="9.5" font-weight="700">家庭自动化</text>
  <text x="201" y="235" class="font muted" font-size="7.5">设备联动</text>
  <circle cx="271" cy="224" r="2.8" fill="#a9a09b"/>
  <text x="278" y="227.5" class="font" font-size="8.5" fill="#756b67">未接入</text>

  <!-- AI -->
  <rect x="172" y="256" width="24" height="24" rx="8" fill="#f5f0ed"/>
  <text x="184" y="273" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#847873">✦</text>
  <text x="201" y="267" class="font" font-size="10.5" font-weight="700">AI 服务</text>
  <text x="201" y="279" class="font muted" font-size="7.5">解析与问答</text>
  <circle cx="271" cy="268" r="2.8" fill="#a9a09b"/>
  <text x="278" y="271.5" class="font" font-size="8.5" fill="#756b67">未配置</text>

  <!-- Lower cards placeholder -->
  <rect x="16" y="338" width="358" height="104" rx="20" fill="#fffdfb" stroke="#eee4df"/>
  <text x="32" y="366" class="font" font-size="14" font-weight="700">库存概览</text>
  <rect x="32" y="382" width="326" height="10" rx="5" fill="#f2e9e4"/>
  <rect x="32" y="401" width="202" height="10" rx="5" fill="#f2e9e4"/>
  <rect x="32" y="420" width="326" height="10" rx="5" fill="#f2e9e4"/>

  <rect x="16" y="456" width="358" height="104" rx="20" fill="#fffdfb" stroke="#eee4df"/>
  <text x="32" y="484" class="font" font-size="14" font-weight="700">提醒与采购</text>
  <rect x="32" y="501" width="202" height="10" rx="5" fill="#f2e9e4"/>
  <rect x="32" y="520" width="326" height="10" rx="5" fill="#f2e9e4"/>

  <!-- bottom nav -->
  <text x="48" y="672" text-anchor="middle" class="font" font-size="21" fill="#d97963">⌂</text>
  <text x="48" y="689" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#d97963">首页</text>
  <text x="145" y="672" text-anchor="middle" class="font muted" font-size="21">▦</text>
  <text x="145" y="689" text-anchor="middle" class="font muted" font-size="10">库存</text>
  <text x="242" y="672" text-anchor="middle" class="font muted" font-size="21">◉</text>
  <text x="242" y="689" text-anchor="middle" class="font muted" font-size="10">助手</text>
  <text x="339" y="672" text-anchor="middle" class="font muted" font-size="21">⚙</text>
  <text x="339" y="689" text-anchor="middle" class="font muted" font-size="10">我的</text>

  <text x="195" y="725" text-anchor="middle" class="font" font-size="10" fill="#a89b95">效果图 · 方案 C：紧凑模块 + 右侧一体化状态面板</text>
</svg>
