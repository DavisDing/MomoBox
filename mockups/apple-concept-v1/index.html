<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MomoBox · 日常，有序 — 移动端概念 V1</title>
  <link rel="stylesheet" href="style.css">
  <script src="icons.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="studio-header">
    <a class="wordmark" href="#" aria-label="MomoBox 概念预览"><span class="brand-mark"><i data-lucide="box"></i></span>MomoBox<span class="edition">DESIGN EXPLORATION / 01</span></a>
    <div class="studio-actions"><span class="prototype-tag">概念预览 · 演示数据</span><button id="theme-toggle" aria-label="切换深浅色"><i data-lucide="moon"></i></button></div>
  </header>
  <main>
    <div class="intro"><div><p class="eyebrow">A LITTLE ORDER. A LOT MORE LIFE.</p><h1>把日常，安放妥当。</h1></div><p class="intro-note">少一点惦记，多一点从容。<br>一个关于家与日常的新提案。</p></div>
    <div class="preview-tabs" aria-label="预览页面"><button class="selected" data-preview="0">今日</button><button data-preview="1">物品</button><button data-preview="2">采买</button></div>
    <div class="device-board" id="device-board">
      <section class="device-column"><div class="device-caption"><span>01 / TODAY</span><span>只关注眼前需要的</span></div><div class="phone" data-start="today"></div></section>
      <section class="device-column"><div class="device-caption"><span>02 / COLLECTION</span><span>家里的每一件，都有位置</span></div><div class="phone" data-start="inventory"></div></section>
      <section class="device-column"><div class="device-caption"><span>03 / SHOPPING</span><span>刚刚好，不多也不少</span></div><div class="phone" data-start="shopping"></div></section>
    </div>
    <footer class="studio-footer"><span>WARM NEUTRALS &nbsp; / &nbsp; QUIET TYPOGRAPHY &nbsp; / &nbsp; TACTILE MOTION</span><span>可点击底栏、物品、添加与采买勾选体验</span></footer>
  </main>
</body>
</html>
