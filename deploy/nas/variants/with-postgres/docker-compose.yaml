# New installations only. PostgreSQL version checked 2026-10-11.
# Never attach an existing PostgreSQL 16/17 volume to this service.
# Importing Compose does not apply MomoBox migrations; see ../README.md.
services:
  postgres:
    mem_limit: 512m
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Bootstrap needs these capabilities to fix existing volume ownership;
    # the official entrypoint then runs PostgreSQL as its postgres user.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momo}
      POSTGRES_USER: ${POSTGRES_USER:-momo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  momo-backend:
    mem_limit: 768m
    # Allow the backend's 10-second graceful drain to finish before SIGKILL.
    stop_grace_period: 15s
    image: ${MOMO_BACKEND_IMAGE:?set MOMO_BACKEND_IMAGE to a pinned GHCR tag or digest in .env}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:?set APP_VERSION to the deployed image version in .env}
      GOMEMLIMIT: 512MiB
      HTTP_ADDR: 0.0.0.0:18473
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set REFRESH_TOKEN_PEPPER in .env}
      HA_TOKEN_ENCRYPTION_KEY: ${HA_TOKEN_ENCRYPTION_KEY:?set HA_TOKEN_ENCRYPTION_KEY in .env}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-first_setup}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROTOCOL: ${AI_PROTOCOL:-auto}
      AI_SECONDARY_ENDPOINT: ${AI_SECONDARY_ENDPOINT:-}
      AI_SECONDARY_MODEL: ${AI_SECONDARY_MODEL:-}
      AI_SECONDARY_API_KEY: ${AI_SECONDARY_API_KEY:-}
      AI_SECONDARY_PROTOCOL: ${AI_SECONDARY_PROTOCOL:-auto}
      AI_FALLBACK_ENDPOINT: ${AI_FALLBACK_ENDPOINT:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_PROTOCOL: ${AI_FALLBACK_PROTOCOL:-auto}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-12582912}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MOMO_BACKEND_PORT:-18473}:18473"
    healthcheck:
      test: ["CMD", "/app/momo-backend", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres18_data:
