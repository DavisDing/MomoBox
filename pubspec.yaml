name: momo_box
description: 本地优先的家庭物品效期与库存管理工具。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  flutter_local_notifications: 18.0.1
  flutter_timezone: 3.0.1
  timezone: 0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1

dependency_overrides: {}
